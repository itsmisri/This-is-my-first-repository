<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distraction Hook — Pixel Arcade Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b10;
            --signal-red: #ff3b30;
            --signal-yellow: #ffd60a;
            --cyan-glow: #00f0ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Arcade Cabinet Frame */
        .arcade-screen {
            width: 640px;
            height: 480px;
            background-color: #10121a;
            border: 4px solid #2a2d3d;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 50px rgba(0, 0, 0, 0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .arcade-screen.shake {
            animation: arcade-shake 0.1s infinite;
        }

        @keyframes arcade-shake {
            0% {
                transform: translate(2px, 2px);
            }

            50% {
                transform: translate(-3px, -1px);
            }

            100% {
                transform: translate(1px, -2px);
            }
        }

        /* HUD Bar */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--cyan-glow);
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        .attention-meter {
            width: 150px;
            height: 16px;
            border: 2px solid #fff;
            padding: 2px;
        }

        .attention-fill {
            width: 100%;
            height: 100%;
            background-color: #34c759;
            transition: all 0.3s ease;
        }

        .attention-fill.danger {
            width: 15%;
            background-color: var(--signal-red);
            box-shadow: 0 0 12px var(--signal-red);
        }

        /* Stage Area */
        .stage-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Spotlight */
        .spotlight {
            width: 180px;
            height: 200px;
            background: linear-gradient(180deg, rgba(255, 214, 10, 0.25) 0%, transparent 100%);
            clip-path: polygon(35% 0%, 65% 0%, 100% 100%, 0% 100%);
            position: absolute;
            top: -40px;
            pointer-events: none;
        }

        /* Pixel Artefact */
        .artefact-wrapper {
            position: relative;
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pixel-leds {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }

        .pixel-led {
            width: 12px;
            height: 12px;
            background-color: #222;
            border: 2px solid #000;
        }

        .pixel-led.red.active {
            background-color: var(--signal-red);
            box-shadow: 0 0 16px var(--signal-red);
        }

        .pixel-led.yellow.active {
            background-color: var(--signal-yellow);
            box-shadow: 0 0 16px var(--signal-yellow);
        }

        .pixel-stand {
            width: 160px;
            height: 180px;
            background-color: #1a1c24;
            border: 4px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .pixel-phone {
            width: 110px;
            height: 120px;
            background-color: #000;
            border: 3px solid #555;
            padding: 6px;
            position: relative;
        }

        .pixel-notification {
            background-color: var(--cyan-glow);
            color: #000;
            font-size: 8px;
            padding: 6px;
            line-height: 1.4;
            opacity: 0;
            transform: translateY(-8px);
            transition: all 0.2s ease;
        }

        .pixel-notification.active {
            opacity: 1;
            transform: translateY(0);
        }

        .sensor-eyes {
            display: flex;
            gap: 16px;
            margin-top: 12px;
        }

        .sensor-eye {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(#666, #111);
            border: 2px solid #fff;
        }

        /* Game Banner Alert */
        .game-banner {
            font-size: 14px;
            color: var(--signal-red);
            text-shadow: 0 0 10px var(--signal-red);
            text-align: center;
            min-height: 24px;
        }

        /* Controls */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 16px;
        }

        .arcade-btn {
            font-family: 'Press Start 2P', monospace;
            padding: 12px 20px;
            font-size: 10px;
            color: #fff;
            background-color: #ff3b30;
            border: 4px solid #fff;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
        }

        .arcade-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }

        .arcade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 4px 4px 0px #000;
        }
    </style>
</head>

<body>

    <div class="arcade-screen" id="arcade-screen">
        <!-- HUD -->
        <div class="hud-bar">
            <div>SCORE: <span id="score-val">0140</span></div>
            <div>
                ATTENTION:
                <div class="attention-meter">
                    <div class="attention-fill" id="attention-fill"></div>
                </div>
            </div>
        </div>

        <!-- STAGE -->
        <div class="stage-area">
            <div class="spotlight"></div>

            <div class="artefact-wrapper">
                <div class="pixel-leds">
                    <div class="pixel-led red" id="p-led-1"></div>
                    <div class="pixel-led yellow" id="p-led-2"></div>
                    <div class="pixel-led yellow" id="p-led-3"></div>
                    <div class="pixel-led red" id="p-led-4"></div>
                </div>

                <div class="pixel-stand">
                    <div class="pixel-phone">
                        <div class="pixel-notification" id="p-notif">
                            ! NEW CHIME<br>
                            PING DETECTED
                        </div>
                    </div>
                    <div class="sensor-eyes">
                        <div class="sensor-eye"></div>
                        <div class="sensor-eye"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BANNER -->
        <div class="game-banner" id="game-banner">PRESS START TO TRIGGER NOTIFICATION</div>
    </div>

    <div class="controls">
        <button class="arcade-btn" id="btn-trigger">TRIGGER NOTIFICATION</button>
        <button class="arcade-btn" id="btn-reset" style="background-color: #34c759;" disabled>RESET</button>
    </div>

    <script>
        const screen = document.getElementById('arcade-screen');
        const triggerBtn = document.getElementById('btn-trigger');
        const resetBtn = document.getElementById('btn-reset');
        const notif = document.getElementById('p-notif');
        const fill = document.getElementById('attention-fill');
        const banner = document.getElementById('game-banner');
        const leds = [
            document.getElementById('p-led-1'),
            document.getElementById('p-led-2'),
            document.getElementById('p-led-3'),
            document.getElementById('p-led-4')
        ];

        let loop = null;

        triggerBtn.addEventListener('click', () => {
            triggerBtn.disabled = true;
            resetBtn.disabled = false;
            screen.classList.add('shake');
            notif.classList.add('active');
            fill.classList.add('danger');
            banner.textContent = 'ATTENTION SHIFTED! GAME OVER';

            loop = setInterval(() => {
                leds.forEach(led => {
                    if (Math.random() > 0.4) led.classList.add('active');
                    else led.classList.remove('active');
                });
            }, 80);
        });

        resetBtn.addEventListener('click', () => {
            triggerBtn.disabled = false;
            resetBtn.disabled = true;
            screen.classList.remove('shake');
            notif.classList.remove('active');
            fill.classList.remove('danger');
            banner.textContent = 'PRESS START TO TRIGGER NOTIFICATION';
            clearInterval(loop);
            leds.forEach(led => led.classList.remove('active'));
        });
    </script>
</body>

</html>
